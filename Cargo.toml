[workspace]
members = ["core", "common", "cli", "app/src-tauri", "host"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# в криптокоде переполнения идут через wrapping_*, так что проверки ловят только настоящие баги
overflow-checks = true
panic = "abort"
strip = true

# Линты держим в одном месте, крейты подключают через [lints] workspace = true.
# Всё на warn, не deny: сборку не роняем, но паники и недокументированный unsafe
# попадают на глаза. Затянуть до deny можно, когда разгребём бэклог предупреждений.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
# группу целиком поднимаем с отрицательным приоритетом, отдельные правила ниже перебивают
pedantic = { level = "warn", priority = -1 }
# паника на входных данных - это DoS; unwrap/expect/panic не запрещаем, но подсвечиваем
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# каждый unsafe-блок должен нести // SAFETY: с обоснованием (wipe.rs, lockmem.rs, osrng.rs)
undocumented_unsafe_blocks = "warn"
# слишком дословные для этого проекта - глушим, чтобы pedantic не шумел зря
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
