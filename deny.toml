# Конфиг cargo-deny: аудит зависимостей в CI (уязвимости, лицензии, дубли версий).
# Первый прогон на новой машине может подсветить лицензию, которую надо добавить в
# allow ниже - это ожидаемо, список пополняется по факту.

[advisories]
version = 2
# RustSec: известные CVE по Cargo.lock. Всё, что db найдёт, роняет проверку.
yanked = "warn"

[licenses]
version = 2
# Проект под GPL-3.0-or-later; зависимости - разрешительные лицензии, совместимые с ним.
allow = [
    "GPL-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
# дубли версий одного крейта - предупреждение, не ошибка (транзитивные конфликты бывают)
multiple-versions = "warn"
wildcards = "deny"

[sources]
# ставим только с crates.io; любой git-источник надо осознанно разрешить
unknown-registry = "deny"
unknown-git = "deny"
